<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>MEC361 Lecture Exams</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=Cairo:wght@400;600&display=swap">
<style>
/* Layout: course header and three lecture tabs on top; each tab runs its own exam (one question at a time beside a numbered palette). */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#14202e; --muted:#566677; --line:#d6dee7;
  --accent:#0b6e7a; --accent-ink:#ffffff; --accent-soft:#dcf0f2;
  --good:#1b7f4b; --good-soft:#dff2e6; --bad:#b3261e; --bad-soft:#fbe4e1;
  --flag:#a86a0a; --flag-soft:#fbefd5;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Space Grotesk','Inter',system-ui,sans-serif;
  --font-ar:'Cairo','Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#172029; --ink:#e6edf4; --muted:#9aa8b7; --line:#2a3643;
  --accent:#4cc2d1; --accent-ink:#06242a; --accent-soft:#123942;
  --good:#5ad08f; --good-soft:#12301f; --bad:#ff8f86; --bad-soft:#3a1815;
  --flag:#e8b64c; --flag-soft:#3a2d10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#172029; --ink:#e6edf4; --muted:#9aa8b7; --line:#2a3643;
  --accent:#4cc2d1; --accent-ink:#06242a; --accent-soft:#123942;
  --good:#5ad08f; --good-soft:#12301f; --bad:#ff8f86; --bad-soft:#3a1815;
  --flag:#e8b64c; --flag-soft:#3a2d10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--muted)}
/* start */
.start{padding-block:56px 0;max-width:640px;margin:0 auto}
.start h1{font-size:clamp(30px,6vw,44px);margin-bottom:6px}
.start .sub{color:var(--muted);margin:0 0 28px}
.rules{list-style:none;padding:0;margin:0 0 26px;display:grid;gap:10px}
.rules li{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.rules b{font-variant-numeric:tabular-nums}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.check{display:flex;gap:8px;align-items:center;margin:0 0 20px;color:var(--muted)}
/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -16px;padding:10px 16px}
.barin{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:700}
.grow{flex:1;min-width:0}
.timer{font-family:var(--font-display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;padding:2px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
/* exam */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:24px;padding-top:22px;align-items:start}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.qmeta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--muted)}
.qno{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--accent)}
.qtext{font-size:18px;font-weight:500;margin:0 0 18px;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
.opt:hover{border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--surface)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.flagbtn.on{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.side{position:sticky;top:78px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.side h3{font-size:14px;margin-bottom:10px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
.pal button{height:34px;border-radius:7px;border:1px solid var(--line);background:var(--bg);font-size:12px;font-variant-numeric:tabular-nums;padding:0}
.pal button.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pal button.fl{box-shadow:inset 0 -3px 0 var(--flag)}
.pal button.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.confirm{background:var(--flag-soft);border:1px solid var(--flag);border-radius:10px;padding:14px 16px;margin-top:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
/* results */
.res{padding-top:30px}
.score{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 22px}
.big{font-family:var(--font-display);font-weight:700;font-size:clamp(54px,12vw,88px);line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:.4em;color:var(--muted);font-weight:500}
.stats{display:flex;gap:22px;flex-wrap:wrap;color:var(--muted);font-size:14px;padding-bottom:8px}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 14px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:12px}
.rv .qtext{font-size:16px;margin-bottom:12px}
.pill{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.pill.skip{background:var(--flag-soft);color:var(--flag)}
.ro{display:flex;gap:10px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);margin-bottom:6px;font-size:14px}
.ro.right{background:var(--good-soft);border-color:var(--good)}
.ro.wrong{background:var(--bad-soft);border-color:var(--bad)}
.ro b{flex:none;width:18px}
.ro .tag{margin-left:auto;flex:none;font-size:12px;font-weight:600}
.exp{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--accent-soft);font-family:var(--font-ar);font-size:15.5px;line-height:1.8;direction:rtl;text-align:right;unicode-bidi:plaintext}
@media (max-width:760px){
  .exam{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .qcard{padding:16px}
  .qtext{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* course header + tabs */
.top{border-bottom:1px solid var(--line);margin:0 -16px;padding:22px 16px 0;background:var(--surface)}
.topin{max-width:1040px;margin:0 auto}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top h1{font-size:clamp(24px,5vw,34px);margin:4px 0 4px}
.doc{color:var(--muted);margin:0 0 16px}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{flex:1 1 0;min-width:0;text-align:left;border:0;border-bottom:3px solid transparent;background:transparent;padding:10px 14px 12px;border-radius:8px 8px 0 0}
.tab:hover{background:var(--bg)}
.tab[aria-selected="true"]{border-bottom-color:var(--accent);background:var(--bg)}
.tab b{display:block;font-family:var(--font-display);font-size:16px}
.tab small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .st{display:inline-block;margin-top:4px;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--line);color:var(--muted)}
.tab .st.run{background:var(--flag-soft);color:var(--flag)}
.tab .st.done{background:var(--good-soft);color:var(--good)}
@media (max-width:560px){.tab{padding:8px 8px 10px}.tab small{display:none}}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="eyebrow">MEC361 · Fall 2026-2027</div>
  <h1>Mechatronics Measurements and Devices</h1>
  <p class="doc">Dr. Ahmed Abd El Alem Abdullah Mohamed</p>
  <div class="tabs" id="tabs" role="tablist" aria-label="Lectures"></div>
</div></header>
<div id="view"></div>
<script>
const DATA = {"1": [{"n": 1, "type": "mcq", "q": "The act of assigning a specific value to a physical variable is called:", "opts": ["Transduction", "Measurement", "Observation", "Calibration"], "ans": "B", "exp": "القياس (Measurement) هو إننا نعطي قيمة محددة لمتغير فيزيائي. الـ Transduction هو تحويل طاقة من شكل لشكل، والـ Calibration هو معايرة الجهاز، والـ Observation مجرد ملاحظة من غير قيمة رقمية."}, {"n": 2, "type": "mcq", "q": "A device that converts one form of energy into another form of energy is called a:", "opts": ["Observer", "Comparator", "Transducer", "Process"], "ans": "C", "exp": "الـ Transducer هو الجهاز اللي بيحوّل شكل طاقة لشكل طاقة تاني (مثلاً حرارة إلى كهرباء). الـ Observer هو شخص، والـ Comparator بيقارن قيمتين، والـ Process هو النظام اللي بيطلّع المعلومة."}, {"n": 3, "type": "mcq", "q": "A device that, when exposed to a physical phenomenon, produces a proportional output signal in a more usable form is called a:", "opts": ["Observer", "Comparator", "Process", "Sensor"], "ans": "D", "exp": "الـ Sensor لما يتعرض لظاهرة فيزيائية بيطلّع إشارة خرج متناسبة معاها وفي شكل أسهل في الاستخدام (غالباً كهربي)."}, {"n": 4, "type": "mcq", "q": "A thermocouple responds to a temperature change (thermal energy) and outputs a proportional change in:", "opts": ["Electromotive force (electrical energy)", "Mechanical strain", "Luminous intensity", "Magnetic flux density"], "ans": "A", "exp": "الـ thermocouple بيستقبل تغير في درجة الحرارة (طاقة حرارية) ويطلّع تغير متناسب في القوة الدافعة الكهربية e.m.f. (طاقة كهربية)."}, {"n": 5, "type": "mcq", "q": "Because a thermocouple converts thermal energy into electrical energy, it can be called a:", "opts": ["Comparator only", "Observer", "Process", "Sensor and/or transducer"], "ans": "D", "exp": "لأن الـ thermocouple بيحس بالحرارة (فهو sensor) وكمان بيحوّل طاقة حرارية إلى كهربية (فهو transducer)، فينفع نسميه sensor و/أو transducer."}, {"n": 6, "type": "mcq", "q": "Which of the following is a benefit of measurements?", "opts": ["Increasing the error of the process", "Data for safe and economic performance of systems", "Removing the need for control", "Replacing the observer by the process"], "ans": "B", "exp": "فايدة القياس إنه بيدّي بيانات للتشغيل الآمن والاقتصادي للأنظمة. باقي الاختيارات عكس الغرض من القياس."}, {"n": 7, "type": "mcq", "q": "Measurements provide basic input data for:", "opts": ["Control of processes and operations", "Increasing the error E", "Removing the sensor", "Hiding the measured variable"], "ans": "A", "exp": "القياسات هي المدخل الأساسي لـ control of processes and operations؛ من غير قياس مفيش feedback ولا تحكم."}, {"n": 8, "type": "mcq", "q": "Which of the following is NOT a branch of the 'Why Measure?' diagram?", "opts": ["Generate data for design", "For commerce", "Generate data to remove the observer", "Generate data to validate or propose a theory"], "ans": "C", "exp": "فروع «Why Measure?» هي: بيانات للتصميم، للتجارة (commerce)، لإثبات أو اقتراح نظرية، للتحكم، وللتشغيل الآمن. أما «إزالة الـ observer» فمش فرع منها، وده سبب إنها الإجابة الغلط المطلوبة (NOT)."}, {"n": 9, "type": "mcq", "q": "A process is defined as a system which generates:", "opts": ["Error", "A transducer", "A comparator", "Information"], "ans": "D", "exp": "الـ Process هو نظام بيولّد information (معلومات/متغيرات) الـ observer محتاجها."}, {"n": 10, "type": "mcq", "q": "Which of the following is an example of a process?", "opts": ["A thermocouple", "A strain gauge", "A chemical reactor", "An amplifier"], "ans": "C", "exp": "المفاعل الكيميائي (Chemical reactor) هو process. أما الـ thermocouple والـ strain gauge فهما sensors، والـ amplifier عنصر signal conditioning."}, {"n": 11, "type": "mcq", "q": "A car as a process generates the information variables:", "opts": ["Displacement, velocity and acceleration", "Temperature, pressure and composition", "Resistance, capacitance and inductance", "Density, viscosity and pH"], "ans": "A", "exp": "العربية كـ process بتولّد المتغيرات displacement و velocity و acceleration، وهي المعلومات اللي السواق محتاجها."}, {"n": 12, "type": "mcq", "q": "A chemical reactor as a process generates the information variables:", "opts": ["Displacement, velocity and acceleration", "Temperature, pressure and composition", "Frequency, magnetic flux and illumination", "Torque, force and angular velocity"], "ans": "B", "exp": "المفاعل الكيميائي كـ process بيولّد temperature و pressure و composition."}, {"n": 13, "type": "mcq", "q": "In the measurement system, the observer is defined as:", "opts": ["The sensor that touches the process", "A person who needs the information from theprocess", "The unit of the measured variable", "The error between two values"], "ans": "B", "exp": "الـ Observer هو شخص محتاج المعلومة من الـ process (سواق، operator، ممرضة...)."}, {"n": 14, "type": "mcq", "q": "Which of the following is an example of an observer?", "opts": ["A comparator", "A thermocouple", "A nurse", "A cantilever"], "ans": "C", "exp": "الممرضة شخص محتاج معلومة (مثلاً درجة حرارة المريض) فهي observer. الباقي (comparator, thermocouple, cantilever) أجهزة مش أشخاص."}, {"n": 15, "type": "mcq", "q": "The purpose of the measurement system is to:", "opts": ["Replace the process", "Generate the true value", "Increase the error", "Link the observer to theprocess"], "ans": "D", "exp": "غرض نظام القياس إنه يربط (link) الـ observer بالـ process، يعني يوصّل المعلومة للشخص المحتاجها."}, {"n": 16, "type": "mcq", "q": "The input to the measurement system is the:", "opts": ["True value of the variable", "Measured value of the variable", "Error signal only", "Decision of the observer"], "ans": "A", "exp": "مدخل نظام القياس هو القيمة الحقيقية (True value) للمتغير، والنظام بيطلّع القيمة المقاسة."}, {"n": 17, "type": "mcq", "q": "The output of the measurement system is the:", "opts": ["True value of the variable", "Process itself", "Reference value", "Measured value of the variable"], "ans": "D", "exp": "خرج نظام القياس هو القيمة المقاسة (Measured value) للمتغير."}, {"n": 18, "type": "mcq", "q": "In an ideal measurement system, the measured value is:", "opts": ["Greater than the true value", "Less than the true value", "Equal to the true value", "Equal to zero"], "ans": "C", "exp": "في النظام المثالي (Ideal) القيمة المقاسة تساوي القيمة الحقيقية، يعني الـ error يساوي صفر."}, {"n": 19, "type": "mcq", "q": "The accuracy of a measurement system is defined as the closeness of the:", "opts": ["Output to zero", "Measured value to the true value", "Input to the output range", "Sensor to the process"], "ans": "B", "exp": "الـ Accuracy هي قرب القيمة المقاسة (Measured value) من القيمة الحقيقية (True value)."}, {"n": 20, "type": "mcq", "q": "The accuracy of a real system is quantified using the measurement system error E, where E equals:", "opts": ["Measured value − true value", "True value − measured value", "Measured value + true value", "Measured value × true value"], "ans": "A", "exp": "الـ error هو الخرج ناقص الدخل. E = Measured value − True value. الإشارة السالبة معناها إن القراءة أقل من الحقيقة، والموجبة معناها أكبر."}, {"n": 21, "type": "mcq", "q": "The measurement system error E can also be written as:", "opts": ["System input − system output", "System output + system input", "System output ÷ system input", "System output − system input"], "ans": "D", "exp": "بما إن خرج النظام هو القيمة المقاسة ودخله هو القيمة الحقيقية، يبقى القانون كالتالي. E = System output − System input."}, {"n": 22, "type": "mcq", "q": "The measured flow rate of gas in a pipe is 11.0 m³/h and the true value is 11.2 m³/h. The error E equals:", "opts": ["−0.2 m³/h", "+0.2 m³/h", "−0.02 m³/h", "+11.2 m³/h"], "ans": "A", "exp": "E = 11.0 − 11.2 = −0.2 m³/h. الإشارة سالبة لأن القراءة أقل من القيمة الحقيقية."}, {"n": 23, "type": "mcq", "q": "The measured rotational speed of an engine is 3140 rpm and the true value is 3133 rpm. The error E equals:", "opts": ["−7 rpm", "+7 rpm", "+3133 rpm", "+3140 rpm"], "ans": "B", "exp": "E = 3140 − 3133 = +7 rpm. الإشارة موجبة لأن القراءة أكبر من القيمة الحقيقية."}, {"n": 24, "type": "mcq", "q": "The main performance indicator of a measurement system is the:", "opts": ["Observer", "Process", "Error", "Unit"], "ans": "C", "exp": "الـ Error هو المؤشر الرئيسي لأداء نظام القياس: كل ما قلّ كان النظام أدق."}, {"n": 25, "type": "mcq", "q": "A perfectly accurate measurement system is:", "opts": ["A theoretical ideal", "Common in real systems", "Always achieved with agood sensor", "Equal to the process"], "ans": "A", "exp": "النظام الدقيق 100% فكرة نظرية (theoretical ideal)؛ في الواقع دايماً فيه error مهما كان الـ sensor كويس."}, {"n": 26, "type": "mcq", "q": "In the room temperature control example, the comparator output (error signal) is equal to:", "opts": ["Td + Ta", "Td − Ta", "Td × Ta", "Ta only"], "ans": "B", "exp": "في مثال التحكم في حرارة الغرفة، الـ comparator بيطلّع إشارة الخطأ (error signal) وهي الحرارة المطلوبة ناقص الحرارة الفعلية. Error signal = Td − Ta."}, {"n": 27, "type": "mcq", "q": "In the room temperature control example, the element that measures the room temperature Ta and feeds it back to the comparator is the:", "opts": ["Heater", "Room", "Temperature measuring device", "Reference value"], "ans": "C", "exp": "جهاز قياس الحرارة (Temperature measuring device) هو اللي بيقيس Ta ويرجّعها للـ comparator (feedback)."}, {"n": 28, "type": "mcq", "q": "In the generalized measurement system, the measured variable at the input is called the:", "opts": ["Output display", "Signal processing", "Error signal", "Measurand"], "ans": "D", "exp": "المتغير المقاس الداخل على النظام اسمه Measurand."}, {"n": 29, "type": "mcq", "q": "In the generalized measurement system, the block that follows the sensor is the:", "opts": ["Variable conversion element", "Signal presentation or recording", "Signal transmission", "Output display/recording"], "ans": "A", "exp": "في النظام المعمّم (generalized)، العنصر اللي بيجي بعد الـ sensor هو Variable conversion element (وهو نفسه signal conditioning)."}, {"n": 30, "type": "mcq", "q": "In the generalized measurement system, the block that carries the output measurement to a remote point is the:", "opts": ["Sensor", "Variable conversion element", "Signal processing", "Signal transmission"], "ans": "D", "exp": "العنصر اللي بينقل خرج القياس لنقطة بعيدة هو Signal transmission."}, {"n": 31, "type": "mcq", "q": "The correct order of the four elements of a measurement system is:", "opts": ["Signal conditioning → sensing → data presentation → signalprocessing", "Sensing → signal conditioning → signal processing → datapresentation", "Sensing → signal processing → signal conditioning → data presentation", "Data presentation → sensing → signal conditioning → signalprocessing"], "ans": "B", "exp": "الترتيب الصحيح للعناصر الأربعة: Sensing → Signal conditioning → Signal processing → Data presentation."}, {"n": 32, "type": "mcq", "q": "The element that is in contact with the process and gives an output depending on the variable to be measured is the:", "opts": ["Signal conditioning element", "Signal processing element", "Data presentation element", "Sensing element"], "ans": "D", "exp": "الـ Sensing element هو اللي في تماس مع الـ process وخرجه بيعتمد على المتغير المقاس."}, {"n": 33, "type": "mcq", "q": "A thermocouple used as a sensing element gives a millivolt e.m.f. that depends on:", "opts": ["Temperature", "Mechanical strain", "Weight", "Speed"], "ans": "A", "exp": "الـ thermocouple كـ sensing element بيدّي e.m.f. بالـ millivolt بتعتمد على درجة الحرارة (Temperature)."}, {"n": 34, "type": "mcq", "q": "A strain gauge used as a sensing element gives a resistance that depends on:", "opts": ["Temperature", "Mechanical strain", "Differential pressure", "Frequency"], "ans": "B", "exp": "الـ strain gauge كـ sensing element مقاومته بتتغير مع الانفعال الميكانيكي (Mechanical strain)."}, {"n": 35, "type": "mcq", "q": "When a system has more than one sensing element, the one in contact with the process is called the:", "opts": ["Secondary sensing element", "Signal conditioning element", "Primary sensing element", "Data presentation element"], "ans": "C", "exp": "لو في أكتر من sensing element، اللي في تماس مع الـ process هو الـ Primary sensing element، والباقي بيكونوا secondary."}, {"n": 36, "type": "mcq", "q": "The signal conditioning element converts the output of the sensing element into a form more suitable for further processing, usually:", "opts": ["A d.c. voltage, d.c. current or frequency signal", "A chart recording", "A visual display unit", "A digital count"], "ans": "A", "exp": "الـ signal conditioning بيحوّل خرج الـ sensor لشكل مناسب للمعالجة، غالباً d.c. voltage أو d.c. current أو frequency."}, {"n": 37, "type": "mcq", "q": "Which element amplifies millivolts to volts?", "opts": ["Deflection bridge", "Amplifier", "Oscillator", "Chart recorder"], "ans": "B", "exp": "الـ Amplifier هو العنصر اللي بيكبّر الـ millivolts لـ volts."}, {"n": 38, "type": "mcq", "q": "Which element converts a voltage into a digital form for input to a computer?", "opts": ["Deflection bridge", "Oscillator", "Analogue-to-digital converter (ADC)", "Chart recorder"], "ans": "C", "exp": "الـ ADC (Analogue-to-Digital Converter) بيحوّل الـ voltage لشكل رقمي علشان يدخل الكمبيوتر."}, {"n": 39, "type": "mcq", "q": "Which of the following is a typical calculation of the signal processing element?", "opts": ["Correction for sensing element non-linearity", "Conversion of impedance change into voltage change", "Amplification of millivolts to volts", "Presenting the value on a pointer–scale indicator"], "ans": "A", "exp": "من الحسابات المعتادة للـ signal processing: تصحيح الـ non-linearity في الـ sensing element. أما تحويل impedance لـ voltage (deflection bridge) وتكبير الـ millivolts (amplifier) فهما signal conditioning، وعرض القيمة على مؤشر هو data presentation."}, {"n": 40, "type": "mcq", "q": "Computing the total mass of product gas from flow rate and density data is performed by the:", "opts": ["Sensing element", "Signal processing element", "Signal conditioning element", "Data presentation element"], "ans": "B", "exp": "حساب الكتلة الكلية للغاز من بيانات معدل التدفق والكثافة عملية حسابية، يعني Signal processing."}, {"n": 41, "type": "mcq", "q": "The element that presents the measured value in a form that can be easily recognized by the observer is the:", "opts": ["Sensing element", "Signal conditioning element", "Signal processing element", "Data presentation element"], "ans": "D", "exp": "العنصر اللي بيعرض القيمة المقاسة بشكل يتعرّف عليه الـ observer بسهولة هو Data presentation."}, {"n": 42, "type": "mcq", "q": "Which of the following is a data presentation element?", "opts": ["Visual display unit (VDU)", "Deflection bridge", "Oscillator", "Analogue-to-digital converter"], "ans": "A", "exp": "شاشة العرض VDU هي عنصر data presentation. الـ deflection bridge والـ oscillator عناصر conditioning، والـ ADC عنصر processing."}, {"n": 43, "type": "mcq", "q": "Which data presentation element was used in the flow system to obtain a permanent record?", "opts": ["Amplifier", "Analogue-to-digital converter", "Chart recorder", "Thermocouple"], "ans": "C", "exp": "الـ Chart recorder هو اللي بيدّي سجل دائم (permanent record) للقياس في نظام التدفق."}, {"n": 44, "type": "mcq", "q": "In the thermocouple temperature system, the signal conditioning consists of:", "opts": ["An ADC and a computer", "A circuit to compensate for changes in reference junction temperature and an amplifier", "A VDU and a chart recorder", "A cantilever and a strain gauge"], "ans": "B", "exp": "في نظام الـ thermocouple، الـ signal conditioning هو: دايرة تعوّض تغير درجة حرارة الـ reference junction + amplifier. أما ADC والكمبيوتر فهما signal processing."}, {"n": 45, "type": "mcq", "q": "A transducer may incorporate:", "opts": ["Only the data presentation element", "Only the observer", "Only the process", "Both sensing and signal conditioning elements"], "ans": "D", "exp": "الـ Transducer ممكن يجمع بين الـ sensing element والـ signal conditioning element في جهاز واحد."}, {"n": 46, "type": "tf", "q": "A transducer is a device that converts one form of energy into another form of energy.", "opts": ["True", "False"], "ans": "A", "exp": "صح. ده هو تعريف الـ transducer: جهاز يحوّل شكل طاقة لشكل طاقة تاني."}, {"n": 47, "type": "tf", "q": "The input to a measurement system is the measured value of the variable.", "opts": ["True", "False"], "ans": "B", "exp": "غلط. دخل النظام هو القيمة الحقيقية (True value)، أما القيمة المقاسة فهي الخرج."}, {"n": 48, "type": "tf", "q": "In an ideal measurement system the measured value is equal to the true value.", "opts": ["True", "False"], "ans": "A", "exp": "صح. في النظام المثالي القيمة المقاسة بتساوي القيمة الحقيقية."}, {"n": 49, "type": "tf", "q": "A perfectly accurate system is a theoretical ideal.", "opts": ["True", "False"], "ans": "A", "exp": "صح. النظام الدقيق تماماً مجرد فكرة نظرية ومش موجود في الواقع."}, {"n": 50, "type": "tf", "q": "The measurement system error E equals the true value minus the measured value.", "opts": ["True", "False"], "ans": "B", "exp": "غلط. الصح إن الـ error هو المقاسة ناقص الحقيقية مش العكس. E = Measured value − True value."}, {"n": 51, "type": "tf", "q": "If the measured value is 11.0 m³/h and the true value is 11.2 m³/h, the error is +0.2 m³/h.", "opts": ["True", "False"], "ans": "B", "exp": "غلط. القراءة أقل من الحقيقة فالـ error سالب مش موجب. E = 11.0 − 11.2 = −0.2 m³/h."}, {"n": 52, "type": "tf", "q": "The purpose of the measurement system is to link the observer to the process.", "opts": ["True", "False"], "ans": "A", "exp": "صح. غرض نظام القياس إنه يربط الـ observer بالـ process."}, {"n": 53, "type": "tf", "q": "A car driver, a plant operator and a nurse are examples of observers.", "opts": ["True", "False"], "ans": "A", "exp": "صح. السواق والـ plant operator والممرضة كلهم observers، يعني أشخاص محتاجين معلومة من process."}, {"n": 54, "type": "tf", "q": "A chemical reactor generates temperature, pressure and composition variables.", "opts": ["True", "False"], "ans": "A", "exp": "صح. المفاعل الكيميائي بيولّد متغيرات temperature و pressure و composition."}, {"n": 55, "type": "tf", "q": "Error is the main performance indicator of a measurement system.", "opts": ["True", "False"], "ans": "A", "exp": "صح. الـ Error هو المؤشر الرئيسي لأداء نظام القياس."}, {"n": 56, "type": "tf", "q": "A measurement system always contains each of the four element types exactly once.", "opts": ["True", "False"], "ans": "B", "exp": "غلط. مش لازم كل عنصر يظهر مرة واحدة بالظبط؛ ممكن يتكرر (أكتر من sensing element مثلاً) أو يغيب حسب النظام."}, {"n": 57, "type": "tf", "q": "The sensing element is in contact with the process.", "opts": ["True", "False"], "ans": "A", "exp": "صح. الـ sensing element هو اللي في تماس مباشر مع الـ process."}, {"n": 58, "type": "tf", "q": "An ADC is an example of a signal processing element.", "opts": ["True", "False"], "ans": "A", "exp": "صح. الـ ADC مثال على signal processing element (مع الكمبيوتر في مثال الـ thermocouple)."}, {"n": 59, "type": "tf", "q": "A chart recorder is an example of a signal conditioning element.", "opts": ["True", "False"], "ans": "B", "exp": "غلط. الـ chart recorder عنصر data presentation مش signal conditioning."}, {"n": 60, "type": "tf", "q": "Each element in a measurement system may itself be a system made up of simpler components.", "opts": ["True", "False"], "ans": "A", "exp": "صح. كل عنصر في نظام القياس ممكن يكون هو نفسه نظام مكوّن من مكونات أبسط."}, {"n": 61, "type": "tf", "q": "In the thermocouple temperature system, the ADC is part of the signal conditioning stage.", "opts": ["True", "False"], "ans": "B", "exp": "غلط. في نظام الـ thermocouple الـ conditioning هو الـ amplifier ودايرة تعويض الـ reference junction، أما الـ ADC فجزء من الـ signal processing."}], "2": [{"n": 1, "type": "mcq", "q": "The element that first receives energy from the measured medium is the:", "opts": ["Variable conversion element", "Primary sensing element", "Data transmission element", "Data presentation element"], "ans": "B", "exp": "الـ Primary sensing element هو أول عنصر بيستقبل الطاقة من الوسط المقاس (measured medium)."}, {"n": 2, "type": "mcq", "q": "The output of the primary sensing element is some physical variable, for example:", "opts": ["Visual display unit", "Pointer and scale", "Displacement, voltage or change in resistance", "Data storage"], "ans": "C", "exp": "خرج الـ primary sensing element هو متغير فيزيائي، زي إزاحة (displacement) أو جهد (voltage) أو تغير في المقاومة."}, {"n": 3, "type": "mcq", "q": "An instrument could extracts some energy from the:", "opts": ["Observer", "Data presentation element", "Measured medium", "Pointer"], "ans": "C", "exp": "الجهاز بياخد جزء من الطاقة من الوسط المقاس (measured medium)، وده سبب إن القياس بيأثر شوية على الـ process."}, {"n": 4, "type": "mcq", "q": "Good instruments are designed to minimize the:", "opts": ["Range", "Sensitivity", "Resolution", "Error"], "ans": "D", "exp": "الأجهزة الجيدة بتتصمم علشان تقلل الـ Error."}, {"n": 5, "type": "mcq", "q": "The variable conversion element is also called the:", "opts": ["Signal processing element", "Signal conditioning element", "Data presentation element", "Primary sensing element"], "ans": "B", "exp": "الـ Variable conversion element هو نفسه الـ Signal conditioning element: بيحوّل المتغير لمتغير فيزيائي تاني (بيغيّر طبيعته)."}, {"n": 6, "type": "mcq", "q": "The variable manipulation element is also called the:", "opts": ["Signal processing element", "Signal conditioning element", "Data transmission element", "Data storage element"], "ans": "A", "exp": "الـ Variable manipulation element هو نفسه الـ Signal processing element."}, {"n": 7, "type": "mcq", "q": "The element that changes the numerical value of a variable but preserves its physical nature is the:", "opts": ["Variable conversion element", "Primary sensing element", "Data presentation element", "Variable manipulation element"], "ans": "D", "exp": "الـ Variable manipulation بيغيّر القيمة العددية للمتغير ويحافظ على طبيعته الفيزيائية (مثلاً amplifier بيكبّر الجهد وهو لسه جهد). أما الـ conversion فبيغيّر الطبيعة نفسها."}, {"n": 8, "type": "mcq", "q": "The data transmission element is necessary when the functional elements of an instrument are:", "opts": ["Digital", "Active", "Physically separated", "Perfectly accurate"], "ans": "C", "exp": "الـ Data transmission لازم لما تكون العناصر الوظيفية للجهاز متباعدة فيزيائياً (Physically separated)."}, {"n": 9, "type": "mcq", "q": "The data presentation element puts the information into a form recognizable by:", "opts": ["The primary sensing element", "One of the human senses", "The measured medium", "The data transmission element"], "ans": "B", "exp": "الـ Data presentation بيحط المعلومة في شكل تتعرف عليه حاسة من حواس الإنسان (نظر، سمع)."}, {"n": 10, "type": "mcq", "q": "The element that can recreate the stored data upon command is the:", "opts": ["Data storage/playback element", "Data presentation element", "Data transmission element", "Variable manipulation element"], "ans": "A", "exp": "الـ Data storage/playback هو اللي بيخزّن البيانات وبيعيد إنتاجها لما نطلب منه."}, {"n": 11, "type": "mcq", "q": "In the pressure gauge example (piston, piston rod, spring, linkage, pointer and scale), the piston acts as the primary sensing element and converts pressure to:", "opts": ["Motion", "Voltage", "Resistance", "Force"], "ans": "D", "exp": "في مثال الـ pressure gauge، الـ piston هو الـ primary sensing element وبيحوّل الضغط إلى قوة. Force = Pressure × Area."}, {"n": 12, "type": "mcq", "q": "In the pressure gauge example, the piston rod acts as the:", "opts": ["Data transmission element (transfers the force)", "Data presentation element", "Primary sensing element", "Variable manipulation element"], "ans": "A", "exp": "الـ piston rod بينقل القوة من الـ piston للـ spring، يعني دوره Data transmission."}, {"n": 13, "type": "mcq", "q": "In the pressure gauge example, the spring converts force into:", "opts": ["Pressure", "Voltage", "Strain", "Motion"], "ans": "D", "exp": "الـ spring بيحوّل القوة إلى حركة/إزاحة (Motion)، وده variable conversion."}, {"n": 14, "type": "mcq", "q": "In the pressure gauge example, the linkage:", "opts": ["Receives the energy from the fluid first", "Stores the pressure", "Manipulates the motion so that it can be observed", "Converts motion to voltage"], "ans": "C", "exp": "الـ linkage بيعدّل (manipulates) الحركة (بيكبّرها مثلاً) علشان تبقى مناسبة للملاحظة."}, {"n": 15, "type": "mcq", "q": "In the pressure gauge example, the pointer and scale act as the:", "opts": ["Primary sensing element", "Data presentation element", "Variable conversion element", "Data transmission element"], "ans": "B", "exp": "الـ pointer والـ scale بيعرضوا القراءة للشخص، يعني Data presentation."}, {"n": 16, "type": "mcq", "q": "In a passive instrument, the energy expended in moving the pointer is derived entirely from:", "opts": ["The change in the quantity measured (pressure)", "An external power source", "The observer", "A battery"], "ans": "A", "exp": "في الـ passive instrument، الطاقة اللي بتحرّك المؤشر جاية بالكامل من التغير في الكمية المقاسة (الضغط)."}, {"n": 17, "type": "mcq", "q": "In a passive instrument:", "opts": ["There are two energy inputs", "There are no other energy inputs to the system", "An external power source supplies the output energy", "A power source is modulated by the float"], "ans": "B", "exp": "في الـ passive instrument مفيش أي مصدر طاقة تاني (no other energy inputs)."}, {"n": 18, "type": "mcq", "q": "In an active instrument, the energy in the output signal comes from:", "opts": ["The measured quantity", "An external power source", "The observer", "The pointer"], "ans": "B", "exp": "في الـ active instrument طاقة إشارة الخرج جاية من مصدر طاقة خارجي (external power source)، والكمية المقاسة بس بتتحكم في مقدارها."}, {"n": 19, "type": "mcq", "q": "In the petrol-tank level indicator (active), the float system merely modulates the value of the:", "opts": ["Voltage from an external power source", "Pressure of the fluid", "Weight of the pointer", "Speed of the cam"], "ans": "A", "exp": "في مؤشر مستوى البنزين (active)، العوامة (float) بتعدّل (modulate) قيمة الجهد (voltage) القادم من مصدر الطاقة الخارجي."}, {"n": 20, "type": "mcq", "q": "Which statement is true for a passive instrument?", "opts": ["Its resolution is not limited", "It is more expensive", "It has a complex construction", "Its resolution is limited because it depends on the instrument energy"], "ans": "D", "exp": "الـ passive instrument الـ resolution بتاعه محدود لأنه معتمد على طاقة الجهاز نفسه (الصغيرة)."}, {"n": 21, "type": "mcq", "q": "Which statement is true for an active instrument?", "opts": ["It has simple construction", "It is less expensive", "Its resolution is not limited because it depends on an outside energy source", "Its resolution depends on the energy of the measured quantity"], "ans": "C", "exp": "الـ active instrument الـ resolution بتاعه مش محدود لأنه معتمد على مصدر طاقة خارجي (ممكن نكبّر الإشارة)."}, {"n": 22, "type": "mcq", "q": "Compared with an active instrument, a passive instrument is:", "opts": ["More expensive", "More complex in construction", "Simpler in construction and less expensive", "Not limited in resolution"], "ans": "C", "exp": "الـ passive instrument أبسط في التركيب وأرخص من الـ active instrument."}, {"n": 23, "type": "mcq", "q": "The dead-weight pressure gauge is an example of a:", "opts": ["Deflection-type instrument", "Digital instrument", "Smart instrument", "Null-type instrument"], "ans": "D", "exp": "الـ dead-weight pressure gauge مثال على Null-type instrument، لأننا بنوصل لحالة اتزان (null)."}, {"n": 24, "type": "mcq", "q": "In the dead-weight gauge, weights are put on top of the piston until:", "opts": ["The pointer reaches the end of the scale", "The downward force balances the fluidpressure", "The cam rotates", "The microprocessor is activated"], "ans": "B", "exp": "في الـ dead-weight gauge بنحط أوزان فوق الـ piston لحد ما القوة النازلة تتزن مع ضغط السائل (force balance)."}, {"n": 25, "type": "mcq", "q": "In a null-type instrument, the piston is brought to a datum level known as the:", "opts": ["Null point", "Threshold", "Dead space", "Span"], "ans": "A", "exp": "في الـ null-type بيوصل الـ piston لمستوى مرجعي اسمه Null point."}, {"n": 26, "type": "mcq", "q": "In a null-type instrument, the pressure measurement is made in terms of:", "opts": ["The position of a pointer against a scale", "The number of pulses counted", "The value of the weights needed to reach the null position", "The output of a microprocessor"], "ans": "C", "exp": "القياس في الـ null-type بيتم بدلالة قيمة الأوزان اللازمة للوصول لوضع الـ null."}, {"n": 27, "type": "mcq", "q": "For calibration duties, the preferable type of instrument is the:", "opts": ["Deflection-type instrument", "Null-type instrument", "Indicating instrument", "Passive instrument"], "ans": "B", "exp": "في أعمال المعايرة (calibration) الأفضل نستخدم Null-type instrument."}, {"n": 28, "type": "mcq", "q": "A null-type instrument is preferable for calibration duties because of its:", "opts": ["Superior accuracy", "Simpler reading", "Lower cost", "Continuous output"], "ans": "A", "exp": "سبب تفضيل الـ null-type للمعايرة هو دقته الأعلى (Superior accuracy)."}, {"n": 29, "type": "mcq", "q": "The type of instrument that would normally be used in the workplace is the:", "opts": ["Null-type instrument", "Dead-weight gauge", "Rev counter", "Deflection-type instrument"], "ans": "D", "exp": "الجهاز اللي بيُستخدم عادةً في مكان العمل (workplace) هو Deflection-type instrument."}, {"n": 30, "type": "mcq", "q": "A deflection-type instrument is clearly more convenient because:", "opts": ["It is more accurate than a null-type instrument", "It is far simpler to read the position of a pointer against a scale", "It needs no scale", "It needs no pointer"], "ans": "B", "exp": "الـ deflection-type أسهل بكتير في الاستخدام: بنقرأ موضع المؤشر على الـ scale بدل ما نحط أوزان. (هو أسهل مش أدق.)"}, {"n": 31, "type": "mcq", "q": "An analogue instrument gives an output that:", "opts": ["Varies in discrete steps", "Has a finite number of values", "Is always binary", "Varies continuously as the quantity being measured changes"], "ans": "D", "exp": "خرج الـ analogue instrument بيتغير بشكل مستمر (continuously) مع تغير الكمية المقاسة."}, {"n": 32, "type": "mcq", "q": "The output of an analogue instrument can have:", "opts": ["A finite number of values", "Only two values", "An infinite number of values", "Only integer values"], "ans": "C", "exp": "خرج الـ analogue instrument ممكن ياخد عدد لانهائي من القيم."}, {"n": 33, "type": "mcq", "q": "An analogue instrument must be interfaced to a microcomputer by an:", "opts": ["Analogue-to-digital (A/D) converter", "Digital-to-analogue converter", "Schmitt trigger", "Comparator"], "ans": "A", "exp": "لازم نستخدم A/D converter علشان نوصّل analogue instrument بـ microcomputer."}, {"n": 34, "type": "mcq", "q": "A disadvantage of the A/D converter is that it:", "opts": ["Removes the conversion time", "Gives infinite resolution", "Makes the output continuous", "Adds a significant cost to the system"], "ans": "D", "exp": "من عيوب الـ A/D converter إنه بيضيف تكلفة كبيرة (significant cost) للنظام."}, {"n": 35, "type": "mcq", "q": "The A/D conversion operation takes a small time, which is important in:", "opts": ["Calibration labs only", "Passive instruments only", "Critical processes", "Null-type instruments only"], "ans": "C", "exp": "عملية التحويل A/D بتاخد وقت صغير، وده مهم في العمليات الحرجة (Critical processes) اللي محتاجة سرعة."}, {"n": 36, "type": "mcq", "q": "A digital instrument has an output that:", "opts": ["Varies in discrete steps", "Varies continuously", "Has an infinite number of values", "Is always a pointer deflection"], "ans": "A", "exp": "خرج الـ digital instrument بيتغير على خطوات منفصلة (discrete steps)."}, {"n": 37, "type": "mcq", "q": "A digital instrument can only have:", "opts": ["An infinite number of values", "A finite number of values", "One value", "No value"], "ans": "B", "exp": "الـ digital instrument ممكن ياخد عدد محدود (finite) من القيم بس."}, {"n": 38, "type": "mcq", "q": "The rev counter (cam, switch and counter) is an example of a:", "opts": ["Analogue instrument", "Passive pressure gauge", "Null-type instrument", "Digital instrument"], "ans": "D", "exp": "الـ rev counter (cam + switch + counter) بيعدّ نبضات، يعني خرجه أرقام منفصلة، فهو Digital instrument."}, {"n": 39, "type": "mcq", "q": "An instrument with an indicator gives:", "opts": ["An audio or visual indication of the magnitude of the physical quantity measured", "Only a signal for automatic control", "A stored record only", "No indication"], "ans": "A", "exp": "الـ instrument اللي فيه indicator بيدّي إشارة مسموعة أو مرئية بمقدار الكمية الفيزيائية المقاسة."}, {"n": 40, "type": "mcq", "q": "The indicator of an indicating instrument can be an analogue output or a:", "opts": ["Microprocessor", "Digital display", "Dead weight", "Cam"], "ans": "B", "exp": "مؤشر الـ indicating instrument ممكن يكون analogue (مؤشر وscale) أو Digital display."}, {"n": 41, "type": "mcq", "q": "One major drawback of indicating devices is that:", "opts": ["They cannot give an analogue output", "They need a microprocessor", "Human intervention is required to read and record a measurement", "They are always active"], "ans": "C", "exp": "العيب الرئيسي في الـ indicating devices إنها محتاجة تدخل بشري (human intervention) لقراءة القياس وتسجيله."}, {"n": 42, "type": "mcq", "q": "Instruments with a signal output are commonly used aspart of:", "opts": ["Manual reading systems", "Dead-weight calibration", "Automatic control systems", "Visual indication only"], "ans": "C", "exp": "الأجهزة اللي بتطلّع signal output بتُستخدم عادةً كجزء من Automatic control systems."}, {"n": 43, "type": "mcq", "q": "A smart instrument includes a:", "opts": ["Cam", "Float", "Dead weight", "Microprocessor"], "ans": "D", "exp": "الـ smart instrument فيه Microprocessor."}, {"n": 44, "type": "mcq", "q": "A smart instrument includes a microprocessor for:", "opts": ["Moving the pointer by hand", "Communication, processing and control", "Adding calibration weights", "Reading the scale"], "ans": "B", "exp": "الـ smart instrument فيه microprocessor علشان يوفّر Communication و processing و control."}, {"n": 45, "type": "mcq", "q": "A non-smart instrument:", "opts": ["Does not include a microprocessor", "Includes a microprocessor", "Always has a digital display", "Is always active"], "ans": "A", "exp": "الـ non-smart instrument ما فيهوش microprocessor."}, {"n": 46, "type": "tf", "q": "The primary sensing element is the element that first receives energy from the measured medium.", "opts": ["True", "False"], "ans": "A", "exp": "صح. الـ primary sensing element هو أول عنصر بيستقبل طاقة من الوسط المقاس."}, {"n": 47, "type": "tf", "q": "An instrument can measure a quantity without extracting any energy from the measured medium.", "opts": ["True", "False"], "ans": "B", "exp": "غلط. أي جهاز لازم ياخد شوية طاقة من الوسط المقاس، حتى لو صغيرة."}, {"n": 48, "type": "tf", "q": "The variable manipulation element changes the numerical value of a variable but preserves its physical nature.", "opts": ["True", "False"], "ans": "A", "exp": "صح. الـ variable manipulation بيغيّر القيمة العددية ويحافظ على الطبيعة الفيزيائية."}, {"n": 49, "type": "tf", "q": "The variable conversion element is also called the signal processing element.", "opts": ["True", "False"], "ans": "B", "exp": "غلط. الـ variable conversion هو الـ signal conditioning، أما الـ signal processing فهو variable manipulation."}, {"n": 50, "type": "tf", "q": "A data transmission element is necessary when the functional elements are physically separated.", "opts": ["True", "False"], "ans": "A", "exp": "صح. الـ data transmission لازم لما تكون العناصر متباعدة فيزيائياً."}, {"n": 51, "type": "tf", "q": "The data storage/playback element translates the measured data into a form recognizable by the human senses.", "opts": ["True", "False"], "ans": "B", "exp": "غلط. اللي بيحوّل البيانات لشكل تتعرف عليه حواس الإنسان هو data presentation. الـ storage/playback بيخزّن البيانات ويعيدها بس."}, {"n": 52, "type": "tf", "q": "In the pressure gauge example, the pointer and scale act as the data presentation element.", "opts": ["True", "False"], "ans": "A", "exp": "صح. الـ pointer والـ scale هم الـ data presentation element."}, {"n": 53, "type": "tf", "q": "In a passive instrument, the output energy comes from an external power source.", "opts": ["True", "False"], "ans": "B", "exp": "غلط. في الـ passive الطاقة جاية من الكمية المقاسة نفسها. المصدر الخارجي ده خاص بالـ active."}, {"n": 54, "type": "tf", "q": "In an active instrument, the quantity being measured modulates the magnitude of an external power source.", "opts": ["True", "False"], "ans": "A", "exp": "صح. في الـ active، الكمية المقاسة بتعمل modulation لمقدار طاقة مصدر خارجي."}, {"n": 55, "type": "tf", "q": "The resolution of a passive instrument is limited because it depends on the instrument energy.", "opts": ["True", "False"], "ans": "A", "exp": "صح. الـ resolution في الـ passive محدود لأنه معتمد على طاقة الجهاز."}, {"n": 56, "type": "tf", "q": "Active instruments are simpler in construction and less expensive than passive instruments.", "opts": ["True", "False"], "ans": "B", "exp": "غلط. العكس هو الصحيح: الـ passive هو الأبسط والأرخص."}, {"n": 57, "type": "tf", "q": "In a null-type instrument, weights are added until the piston reaches the null point.", "opts": ["True", "False"], "ans": "A", "exp": "صح. في الـ null-type بنضيف أوزان لحد ما الـ piston يوصل للـ null point."}, {"n": 58, "type": "tf", "q": "A null-type instrument is preferable for calibration duties because of its superior accuracy.", "opts": ["True", "False"], "ans": "A", "exp": "صح. الـ null-type مفضّل للمعايرة بسبب دقته الأعلى."}, {"n": 59, "type": "tf", "q": "A deflection-type instrument would normally be used in the workplace.", "opts": ["True", "False"], "ans": "A", "exp": "صح. الـ deflection-type هو اللي بيُستخدم عادةً في الـ workplace."}, {"n": 60, "type": "tf", "q": "A deflection-type instrument is preferred for calibration duties.", "opts": ["True", "False"], "ans": "B", "exp": "غلط. المعايرة بتتعمل بالـ null-type مش الـ deflection-type."}, {"n": 61, "type": "tf", "q": "The output of an analogue instrument varies in discrete steps.", "opts": ["True", "False"], "ans": "B", "exp": "غلط. خرج الـ analogue بيتغير بشكل مستمر (continuous) مش على خطوات منفصلة."}, {"n": 62, "type": "tf", "q": "A digital instrument can only have a finite number of values.", "opts": ["True", "False"], "ans": "A", "exp": "صح. الـ digital instrument ممكن يكون له عدد محدود من القيم فقط."}, {"n": 63, "type": "tf", "q": "An analogue instrument can be connected to a microcomputer without any converter.", "opts": ["True", "False"], "ans": "B", "exp": "غلط. الـ analogue instrument لازم A/D converter علشان يتوصّل بـ microcomputer."}, {"n": 64, "type": "tf", "q": "A drawback of indicating instruments is that human intervention is required to read and record a measurement.", "opts": ["True", "False"], "ans": "A", "exp": "صح. عيب الـ indicating instruments إنها محتاجة إنسان يقرأ ويسجّل القياس."}, {"n": 65, "type": "tf", "q": "Signal-type outputs are commonly used as part of automatic control systems.", "opts": ["True", "False"], "ans": "A", "exp": "صح. الـ signal outputs بتُستخدم عادةً في أنظمة التحكم الأوتوماتيكي."}, {"n": 66, "type": "tf", "q": "A non-smart instrument includes a microprocessor.", "opts": ["True", "False"], "ans": "B", "exp": "غلط. الـ non-smart instrument ما فيهوش microprocessor؛ الـ smart هو اللي فيه."}], "3": [{"n": 1, "type": "mcq", "q": "The accuracy of an instrument is a measure of how close its output reading is to the:", "opts": ["Previous reading", "Full-scale value", "Threshold", "True value"], "ans": "D", "exp": "الـ Accuracy هي مقياس لقرب قراءة الجهاز من القيمة الحقيقية (True value)."}, {"n": 2, "type": "mcq", "q": "Inaccuracy represents:", "opts": ["The smallest detectable input", "The range of the instrument", "The potential error in a reading", "The speed of response"], "ans": "C", "exp": "الـ Inaccuracy بتمثّل الخطأ المحتمل (potential error) في القراءة."}, {"n": 3, "type": "mcq", "q": "Inaccuracy is often expressed as a percentage of the instrument's:", "opts": ["Actual reading", "Zero reading", "Resolution", "Full-scale (f.s.) reading"], "ans": "D", "exp": "الـ Inaccuracy غالباً بتتكتب كنسبة مئوية من قراءة المقياس الكاملة (Full-scale reading, f.s.) مش من القراءة الفعلية."}, {"n": 4, "type": "mcq", "q": "The term frequently used in place of inaccuracy is:", "opts": ["Sensitivity", "Measurement uncertainty", "Resolution", "Dead space"], "ans": "B", "exp": "المصطلح اللي بيُستخدم كتير بدل Inaccuracy هو Measurement uncertainty."}, {"n": 5, "type": "mcq", "q": "A pressure gauge of range 0–10 bar has an inaccuracy of ±1.0% f.s. The maximum expected error for any reading is:", "opts": ["0.1 bar", "0.01 bar", "1.0 bar", "10 bar"], "ans": "A", "exp": "أقصى خطأ بيتحسب كنسبة من الـ full scale. Max error = 1.0% × 10 bar = 0.1 bar. وده ثابت في أي قراءة على المقياس لأن النسبة من الـ full scale."}, {"n": 6, "type": "mcq", "q": "For the 0–10 bar gauge with ±1.0% f.s. inaccuracy, when the reading is 1.0 bar the potential error is:", "opts": ["10% of the reading", "1% of the reading", "0.1% of the reading", "100% of the reading"], "ans": "A", "exp": "الخطأ المحتمل ثابت ويساوي 0.1 bar. لما القراءة تبقى 1.0 bar النسبة بتبقى كبيرة. Error % = 0.1 ÷ 1.0 × 100 = 10% of reading."}, {"n": 7, "type": "mcq", "q": "To keep the percentage error small, the measured values should lie:", "opts": ["Near zero", "In the lowest part of the scale", "Below one-third of f.s.", "In the upper part of the range (ideally above two-thirds of f.s.)"], "ans": "D", "exp": "علشان تفضل نسبة الخطأ صغيرة لازم القراءات تبقى في الجزء العالي من المدى، ويفضّل فوق ثلثي الـ f.s. (two-thirds)."}, {"n": 8, "type": "mcq", "q": "If the pressures are expected to fall between 0 and 1 bar, which gauge should NOT be used?", "opts": ["A 0–2.5 bar g auge", "A 0–10 bar gauge", "A 0–1.5 bar gauge", "A 0–1 bar gauge"], "ans": "B", "exp": "لو الضغط المتوقع بين 0 و1 bar، الـ gauge اللي مداه 0–10 bar مينفعش لأن الخطأ 0.1 bar هيبقى نسبة كبيرة جداً من القراءة."}, {"n": 9, "type": "mcq", "q": "A gauge of range 0–2.5 bar has an inaccuracy of ±1.0% f.s. The maximum error is:", "opts": ["±0.25 bar", "±0.1 bar", "±0.025 bar", "±0.0025 bar"], "ans": "C", "exp": "أقصى خطأ بيتحسب كنسبة من الـ full scale. Max error = 1.0% × 2.5 = ±0.025 bar."}, {"n": 10, "type": "mcq", "q": "A pressure of 2 bar is measured with a 0–10 bar gauge of ±1.0% f.s. The maximum error as a percentage of the reading is:", "opts": ["1%", "0.5%", "5%", "10%"], "ans": "C", "exp": "الخطأ الأقصى 0.1 bar (وهو 1% × 10) والقراءة 2 bar. Error % = 0.1 ÷ 2 × 100 = 5% of reading."}, {"n": 11, "type": "mcq", "q": "A pressure of 2 bar is measured with a 0–2.5 bar gauge of ±1.0% f.s. The maximum error as a percentage of the reading is:", "opts": ["0.25%", "1.25%", "2.5%", "5%"], "ans": "B", "exp": "الخطأ الأقصى 0.025 bar (وهو 1% × 2.5) والقراءة 2 bar. Error % = 0.025 ÷ 2 × 100 = 1.25% of reading."}, {"n": 12, "type": "mcq", "q": "To measure about 2 bar, the 0–2.5 bar gauge is selected rather than the 0–10 bar gauge because:", "opts": ["Its absolute error is a larger fraction of full scale", "It has a larger inaccuracy", "Its range is wider", "The relative error is smaller when the reading is close to full scale"], "ans": "D", "exp": "الـ gauge 0–2.5 bar أحسن لأن القراءة (2 bar) قريبة من الـ full scale، فالخطأ النسبي (relative error) أصغر (1.25% بدل 5%)."}, {"n": 13, "type": "mcq", "q": "A gauge of range 0–5 bar has an inaccuracy of ±2% f.s. The maximum error is:", "opts": ["±0.1 bar", "±0.2 bar", "±0.01 bar", "±2 bar"], "ans": "A", "exp": "أقصى خطأ بيتحسب كنسبة من الـ full scale. Max error = 2% × 5 bar = ±0.1 bar."}, {"n": 14, "type": "mcq", "q": "A voltmeter of range 0–50 V has an inaccuracy of ±1% f.s. The maximum error is:", "opts": ["±0.05 V", "±5 V", "±0.5 V", "±1 V"], "ans": "C", "exp": "أقصى خطأ بيتحسب كنسبة من الـ full scale. Max error = 1% × 50 V = ±0.5 V."}, {"n": 15, "type": "mcq", "q": "The 0–50 V voltmeter (±1% f.s.) reads 10 V. The maximum error as a percentage of the reading is:", "opts": ["5%", "0.5%", "1%", "50%"], "ans": "A", "exp": "القراءة 10 V والخطأ 0.5 V. Error % = 0.5 ÷ 10 × 100 = 5% of reading."}, {"n": 16, "type": "mcq", "q": "Precision (repeatability) refers to the closeness among:", "opts": ["Repeated readings", "The reading and the true value", "The input and the output ranges", "The increasing and decreasing curves"], "ans": "A", "exp": "الـ Precision (repeatability) هي مدى تقارب القراءات المتكررة من بعضها (Repeated readings)، مش قربها من القيمة الحقيقية."}, {"n": 17, "type": "mcq", "q": "Tolerance defines the:", "opts": ["Smallest detectable input", "Maximum error that is to be expected in some value", "Range of the output", "Slope of the characteristic"], "ans": "B", "exp": "الـ Tolerance بتحدد أقصى خطأ متوقع (maximum error) في قيمة معينة، زي قيمة مقاومة."}, {"n": 18, "type": "mcq", "q": "Tolerance is a term that is closely related to:", "opts": ["Resolution", "Threshold", "Accuracy", "Hysteresis"], "ans": "C", "exp": "الـ Tolerance مرتبطة ارتباط وثيق بالـ Accuracy."}, {"n": 19, "type": "mcq", "q": "A resistor of nominal value 1000 Ω has a manufacturing tolerance of ±5%. Its minimum likely value is:", "opts": ["995 Ω", "900 Ω", "950 Ω", "1050 Ω"], "ans": "C", "exp": "الحد الأدنى بيتحسب بطرح نسبة الـ tolerance. Min = 1000 × (1 − 0.05) = 950 Ω."}, {"n": 20, "type": "mcq", "q": "A resistor of nominal value 1000 Ω has a manufacturing tolerance of ±5%. Its maximum likely value is:", "opts": ["1005 Ω", "1050 Ω", "1500 Ω", "950 Ω"], "ans": "B", "exp": "الحد الأقصى بيتحسب بإضافة نسبة الـ tolerance. Max = 1000 × (1 + 0.05) = 1050 Ω."}, {"n": 21, "type": "mcq", "q": "A resistor of nominal value 470 Ω has a tolerance of ±10%. Its maximum likely value is:", "opts": ["480 Ω", "560 Ω", "423 Ω", "517 Ω"], "ans": "D", "exp": "بنحسب قيمة الـ tolerance وبعدين نضيفها للقيمة الاسمية. 10% × 470 = 47 Ω. Max = 470 + 47 = 517 Ω."}, {"n": 22, "type": "mcq", "q": "A resistor of nominal value 470 Ω has a tolerance of ±10%. Its minimum likely value is:", "opts": ["423 Ω", "460 Ω", "380 Ω", "517 Ω"], "ans": "A", "exp": "بنطرح قيمة الـ tolerance (47 Ω) من القيمة الاسمية. Min = 470 − 47 = 423 Ω."}, {"n": 23, "type": "mcq", "q": "A resistor of nominal value 500 Ω has a tolerance of ±2%. Its value is likely to lie between:", "opts": ["498 Ω and 502 Ω", "450 Ω and 550 Ω", "490 Ω and 510 Ω", "400 Ω and 600 Ω"], "ans": "C", "exp": "بنحسب قيمة الـ tolerance وبعدين نطرحها ونضيفها للقيمة الاسمية. 2% × 500 = 10 Ω. Range = 490 Ω to 510 Ω."}, {"n": 24, "type": "mcq", "q": "The input range of an element is specified by:", "opts": ["The minimum and maximum values of I (I_MIN to I_MAX)", "The output change per unit input", "The largest change in I without a change in O", "The slope of the straight line"], "ans": "A", "exp": "الـ input range بيتحدد بأقل وأقصى قيمة للدخل: من I_MIN إلى I_MAX."}, {"n": 25, "type": "mcq", "q": "The output range of an element is specified by:", "opts": ["I_MIN to I_MAX", "The minimum and maximum values of O (O_MIN to O_MAX)", "The ratio ΔO/ΔI", "The derivative dN/dI"], "ans": "B", "exp": "الـ output range بيتحدد بأقل وأقصى قيمة للخرج: من O_MIN إلى O_MAX."}, {"n": 26, "type": "mcq", "q": "Span is the:", "opts": ["Smallest detectable input", "Constant error over the range", "Slope of the characteristic", "Maximum variation in input or output"], "ans": "D", "exp": "الـ Span هو أقصى تغير (maximum variation) في الدخل أو الخرج."}, {"n": 27, "type": "mcq", "q": "The input span is given by:", "opts": ["I_MAX − I_MIN", "I_MAX + I_MIN", "O_MAX − O_MIN", "I_MAX / I_MIN"], "ans": "A", "exp": "Input span = I_MAX − I_MIN."}, {"n": 28, "type": "mcq", "q": "The output span is given by:", "opts": ["O_MAX + O_MIN", "O_MAX − O_MIN", "I_MAX − I_MIN", "O_MAX / O_MIN"], "ans": "B", "exp": "Output span = O_MAX − O_MIN."}, {"n": 29, "type": "mcq", "q": "A pressure transducer has an input range of 0 to 10⁴ Pa and an output range of 4 to 20 mA. Its output span is:", "opts": ["20 mA", "4 mA", "16 mA", "24 mA"], "ans": "C", "exp": "Output span = 20 − 4 = 16 mA. (انتبه: الـ span مش 20، لأن الـ range بيبدأ من 4.)"}, {"n": 30, "type": "mcq", "q": "A thermocouple has an input range of 100 to 250 °C. Its input span is:", "opts": ["250 °C", "350 °C", "100 °C", "150 °C"], "ans": "D", "exp": "Input span = 250 − 100 = 150 °C."}, {"n": 31, "type": "mcq", "q": "A thermocouple has an output range of 4 to 10 mV. Its output span is:", "opts": ["6 mV", "14 mV", "10 mV", "4 mV"], "ans": "A", "exp": "Output span = 10 − 4 = 6 mV."}, {"n": 32, "type": "mcq", "q": "Sensitivity is the change ΔO in output for a unit change ΔI in input, i.e. the ratio:", "opts": ["ΔI/ΔO", "ΔO/ΔI", "O/I_MAX", "ΔO·ΔI"], "ans": "B", "exp": "الـ Sensitivity هي نسبة تغير الخرج لتغير الدخل: ΔO / ΔI."}, {"n": 33, "type": "mcq", "q": "In the limit when ΔI tends to zero, the sensitivity tends to the derivative:", "opts": ["dI/dO", "dN/dO", "dI/dN", "dO/dI"], "ans": "D", "exp": "لما ΔI تقرب من الصفر، الـ sensitivity بتبقى المشتقة dO/dI."}, {"n": 34, "type": "mcq", "q": "For a linear element, dO/dI is equal to:", "opts": ["Zero", "The offset a", "The slope K of the straight line", "The input span"], "ans": "C", "exp": "في العنصر الخطي (linear) الـ sensitivity هي ميل الخط المستقيم (slope). dO/dI = K."}, {"n": 35, "type": "mcq", "q": "For a non-linear element, the sensitivity is:", "opts": ["K + dN/dI", "K − a", "K·N", "a + dN/dI"], "ans": "A", "exp": "في العنصر الغير خطي بنشتق معادلة الخرج، فالـ sensitivity بتتغير مع قيمة الدخل. O = K·I + a + N(I). dO/dI = K + dN/dI."}, {"n": 36, "type": "mcq", "q": "Sensitivity is the ___ of the output versus input characteristic O(I).", "opts": ["Intercept", "Span", "Slope (gradient)", "Range"], "ans": "C", "exp": "الـ Sensitivity هي ميل (Slope / gradient) منحنى العلاقة بين الخرج والدخل."}, {"n": 37, "type": "mcq", "q": "The sensitivity of measurement can be expressed as:", "opts": ["Value of the measurand / scale deflection", "Scale deflection / value of the measurand producing the deflection", "Full-scale reading / zero reading", "Output span × input span"], "ans": "B", "exp": "الـ sensitivity بتتحسب بقسمة انحراف المؤشر (scale deflection) على قيمة الـ measurand اللي سبّبت الانحراف."}, {"n": 38, "type": "mcq", "q": "A 30 °C change in temperature gives a 7 Ω change in the resistance of a platinum resistance thermometer. The measurement sensitivity is:", "opts": ["4.29 Ω/°C", "0.0233 Ω/°C", "210 Ω/°C", "0.233 Ω/°C"], "ans": "D", "exp": "Sensitivity = ΔO / ΔI = 7 Ω ÷ 30 °C = 0.233 Ω/°C."}, {"n": 39, "type": "mcq", "q": "A linear pressure transducer has an input range of 0–10 kPa and an output range of 4– 20 mA. Its sensitivity is:", "opts": ["0.625 mA/kPa", "16 mA/kPa", "1.6 mA/kPa", "2.0 mA/kPa"], "ans": "C", "exp": "Sensitivity = output span ÷ input span = 16 mA ÷ 10 kPa = 1.6 mA/kPa."}, {"n": 40, "type": "mcq", "q": "A linear sensor has an input range of 0–100 °C and an output range of 0–5 V. Its sensitivity is:", "opts": ["0.05 V/°C", "20 V/°C", "0.5 V/°C", "5 V/°C"], "ans": "A", "exp": "Sensitivity = 5 V ÷ 100 °C = 0.05 V/°C."}, {"n": 41, "type": "mcq", "q": "An element is said to be linear if corresponding values of I and O lie on:", "opts": ["A parabola", "A hysteresis loop", "A step curve", "A straight line"], "ans": "D", "exp": "العنصر يكون خطي (linear) لو قيم الدخل والخرج المقابلة ليها بتقع على خط مستقيم (straight line)."}, {"n": 42, "type": "mcq", "q": "The ideal straight line connects the minimum point A(I_MIN, O_MIN) to the:", "opts": ["Origin only", "Maximum point B(I_MAX, O_MAX)", "Point of maximum hysteresis", "Dead space point"], "ans": "B", "exp": "الخط المثالي (ideal straight line) بيوصل النقطة الدنيا بالنقطة القصوى. A(I_MIN, O_MIN) → B(I_MAX, O_MAX)."}, {"n": 43, "type": "mcq", "q": "The ideal straight-line equation is:", "opts": ["O_IDEAL = K/I + a", "O_IDEAL = K·I + a", "O_IDEAL = K·a + I", "O_IDEAL = I − K·a"], "ans": "B", "exp": "ده هو شكل معادلة الخط المستقيم المثالي. O_IDEAL = K·I + a."}, {"n": 44, "type": "mcq", "q": "The ideal straight-line slope K equals:", "opts": ["(I_MAX − I_MIN)/(O_MAX − O_MIN)", "O_MAX − O_MIN", "(O_MAX − O_MIN)/(I_MAX − I_MIN)", "I_MAX·O_MAX"], "ans": "C", "exp": "ميل الخط المثالي هو الـ output span مقسوم على الـ input span. K = (O_MAX − O_MIN) ÷ (I_MAX − I_MIN)."}, {"n": 45, "type": "mcq", "q": "The ideal straight-line intercept a equals:", "opts": ["O_MIN − K·I_MIN", "O_MIN + K·I_MIN", "K·I_MIN − O_MAX", "I_MIN − K·O_MIN"], "ans": "A", "exp": "الـ intercept بيتحسب من نقطة البداية. a = O_MIN − K·I_MIN."}, {"n": 46, "type": "mcq", "q": "For a linear transducer with an input range of 0–10 kPa and an output range of 4–20 mA, the intercept (offset) a equals:", "opts": ["16 mA", "1.6 mA", "0 mA", "4 mA"], "ans": "D", "exp": "a = O_MIN − K·I_MIN = 4 − 1.6 × 0 = 4 mA."}, {"n": 47, "type": "mcq", "q": "For the ideal line O = 1.6 I + 4 (mA, I in kPa), the output at 2.5 kPa is:", "opts": ["4 mA", "6 mA", "8 mA", "10 mA"], "ans": "C", "exp": "O = 1.6 × 2.5 + 4 = 4 + 4 = 8 mA."}, {"n": 48, "type": "mcq", "q": "For the ideal line O = 1.6 I + 4 (mA, I in kPa), the input corresponding to 12 mA is:", "opts": ["4 kPa", "5 kPa", "7.5 kPa", "8 kPa"], "ans": "B", "exp": "12 = 1.6·I + 4 ⇒ I = (12 − 4) ÷ 1.6 = 5 kPa."}, {"n": 49, "type": "mcq", "q": "A linear sensor has an input range of 20–120 °C and an output range of 4–20 mA. Its sensitivity K is:", "opts": ["0.8 mA/°C", "6.25 mA/°C", "0.016 mA/°C", "0.16 mA/°C"], "ans": "D", "exp": "K = (20 − 4) ÷ (120 − 20) = 16 ÷ 100 = 0.16 mA/°C."}, {"n": 50, "type": "mcq", "q": "A linear sensor has an input range of 20–120 °C and an output range of 4–20 mA, the intercept a = O_MIN − K·I_MIN equals:", "opts": ["0.8 mA", "4 mA", "3.2 mA", "−0.8 mA"], "ans": "A", "exp": "a = O_MIN − K·I_MIN = 4 − 0.16 × 20 = 4 − 3.2 = 0.8 mA."}, {"n": 51, "type": "mcq", "q": "Non-linearity N(I) is defined as:", "opts": ["(K·I + a) − O(I)", "O(I) − (K·I + a)", "O(I)/(K·I + a)", "K·I − a"], "ans": "B", "exp": "الـ Non-linearity هي الفرق بين الخرج الفعلي والخرج المثالي على الخط المستقيم. N(I) = O(I) − (K·I + a)."}, {"n": 52, "type": "mcq", "q": "The actual output can be written as O(I) =", "opts": ["K·I + a − N(I)", "K·I − a·N(I)", "(K·I + a)/N(I)", "K·I + a + N(I)"], "ans": "D", "exp": "الخرج الفعلي هو الخرج المثالي زائد الـ non-linearity. O(I) = K·I + a + N(I)."}, {"n": 53, "type": "mcq", "q": "Non-linearity is the difference between:", "opts": ["Input range and output range", "Increasing and decreasing readings", "Actual and ideal straight-line behaviour", "Measured value and true value"], "ans": "C", "exp": "الـ Non-linearity هي الفرق بين السلوك الفعلي والسلوك المثالي على الخط المستقيم (Actual and ideal straight-line behaviour)."}, {"n": 54, "type": "mcq", "q": "The maximum non-linearity is often expressed as a percentage of:", "opts": ["Full-scale deflection (O_MAX − O_MIN)", "The input reading", "The sensitivity", "The resolution"], "ans": "A", "exp": "أقصى non-linearity بتتعبّر عادةً كنسبة مئوية من الـ full-scale deflection (O_MAX − O_MIN)."}, {"n": 55, "type": "mcq", "q": "The maximum non-linearity as a percentage of f.s.d. equals:", "opts": ["(N̂ / (I_MAX − I_MIN)) × 100%", "((O_MAX − O_MIN) / N̂) × 100%", "(ΔI_R / (I_MAX − I_MIN)) × 100%", "(N̂ / (O_MAX − O_MIN)) × 100%"], "ans": "D", "exp": "الـ max non-linearity كنسبة من الـ full-scale deflection، حيث N̂ هو أقصى فرق بين الخرج الفعلي والمثالي. Max non-linearity = N̂ ÷ (O_MAX − O_MIN) × 100%."}, {"n": 56, "type": "mcq", "q": "The maximum difference between actual and ideal straight-line output values is 2 mV and the output span is 100 mV. The maximum non-linearity is:", "opts": ["2% of f.s.d.", "0.2% of f.s.d.", "20% of f.s.d.", "50% of f.s.d."], "ans": "A", "exp": "بنحسب نسبة أقصى فرق إلى الـ output span. Max non-linearity = 2 mV ÷ 100 mV × 100 = 2% of f.s.d."}, {"n": 57, "type": "mcq", "q": "In the thermocouple amplifier example (0– 100 °C, 0–4.0 mV), the slope K of the end- point line is:", "opts": ["0.4 mV/°C", "0.04 mV/°C", "0.025 mV/°C", "4 mV/°C"], "ans": "B", "exp": "K = (4.0 − 0) ÷ (100 − 0) = 0.04 mV/°C."}, {"n": 58, "type": "mcq", "q": "For the end-point straight line, the non- linearity N(I) at I_MIN and I_MAX equals:", "opts": ["Zero", "Its maximum value", "K", "The output span"], "ans": "A", "exp": "في الخط المستقيم بين نقطتي النهاية (end-point line) الخط بيعدّي بالنقطتين دول بالظبط، فالـ non-linearity عندهم بتساوي صفر."}, {"n": 59, "type": "mcq", "q": "Zero drift is:", "opts": ["A change in the slope of the characteristic", "A constant error that exists over the full range of measurement", "The smallest detectable input", "Different readings for increasing and decreasing input"], "ans": "B", "exp": "الـ Zero drift هو خطأ ثابت (constant error) موجود على مدى القياس كله."}, {"n": 60, "type": "mcq", "q": "Sensitivity drift (scale factor drift) is the amount by which an instrument's:", "opts": ["Zero reading varies with the observer only", "Resolution is reduced by the observer", "Sensitivity of measurement varies as ambient conditions change", "Hysteresis is removed"], "ans": "C", "exp": "الـ Sensitivity drift (scale factor drift) هو مقدار تغير sensitivity الجهاز لما ظروف المحيط (ambient conditions) تتغير."}, {"n": 61, "type": "mcq", "q": "In the zero-drift, the characteristic with zero drift is:", "opts": ["Steeper than the nominal characteristic", "Parallel to the nominal characteristic", "Crossing the nominal at full scale", "A stepped curve"], "ans": "B", "exp": "الـ characteristic اللي فيه zero drift بيكون موازي (parallel) للـ nominal characteristic، لأن الإزاحة ثابتة، فالميل ما اتغيرش."}, {"n": 62, "type": "mcq", "q": "A voltmeter reads 10.2, 20.3, 39.7 and 49.8 V at 20 °C and 10.5, 20.6, 40.0 and 50.1 V at 50 °C for the same inputs. The zero drift at 50 °C is:", "opts": ["0.03 V", "3 V", "0.1 V", "0.3 V"], "ans": "D", "exp": "بنحسب الفرق بين قراءة 50 °C وقراءة 20 °C عند كل نقطة. 10.5 − 10.2 = 0.3, 20.6 − 20.3 = 0.3, 40.0 − 39.7 = 0.3, 50.1 − 49.8 = 0.3. الفرق ثابت عند كل النقاط، يعني الـ zero drift هو 0.3 V."}, {"n": 63, "type": "mcq", "q": "The zero drift coefficient equals the magnitude of the drift divided by:", "opts": ["The full-scale reading", "The input span", "The magnitude of the temperature change causingthe drift", "The sensitivity"], "ans": "C", "exp": "الـ zero drift coefficient هو مقدار الـ drift مقسوماً على مقدار تغير درجة الحرارة المسبّب له. Coefficient = drift ÷ ΔT."}, {"n": 64, "type": "mcq", "q": "An instrument shows a constant drift of 0.6 V when the ambient temperature changes by 20 °C. The zero drift coefficient is:", "opts": ["0.03 V/°C", "0.3 V/°C", "12 V/°C", "0.012 V/°C"], "ans": "A", "exp": "Zero drift coefficient = 0.6 V ÷ 20 °C = 0.03 V/°C."}, {"n": 65, "type": "mcq", "q": "The minimum level of input required before the change in output is large enough to be detectable is called the:", "opts": ["Resolution", "Span", "Tolerance", "Threshold"], "ans": "D", "exp": "الحد الأدنى من الدخل اللازم علشان تغير الخرج يبقى كبير كفاية ويتلاحظ هو الـ Threshold."}, {"n": 66, "type": "mcq", "q": "If a vehicle starts from rest and accelerates, no speedometer reading is observed until the speed reaches:", "opts": ["The full-scale reading", "The resolution", "The tolerance", "The threshold"], "ans": "D", "exp": "لما عربية تتحرك من السكون، العداد ما بيقراش لحد ما السرعة توصل للـ Threshold."}, {"n": 67, "type": "mcq", "q": "Hysteresis means that the output reading for a given input differs depending on:", "opts": ["The observer reading the scale", "The threshold of the instrument", "Whether the input is increasing or decreasing", "The span of the instrument"], "ans": "C", "exp": "الـ Hysteresis معناها إن قراءة الخرج لنفس الدخل بت
