ero drift is a constant error that exists over the full range of measurement.", "opts": ["True", "False"], "ans": "A", "exp": "صح. الـ Zero drift هو خطأ ثابت على مدى القياس كله."}, {"n": 107, "type": "tf", "q": "Sensitivity drift changes the slope of the characteristic.", "opts": ["True", "False"], "ans": "A", "exp": "صح. الـ Sensitivity drift بيغيّر ميل (slope) الـ characteristic."}, {"n": 108, "type": "tf", "q": "The threshold is the minimum level of input required to give a detectable change in output.", "opts": ["True", "False"], "ans": "A", "exp": "صح. الـ Threshold هو أقل دخل مطلوب علشان يحصل تغير ملحوظ في الخرج."}, {"n": 109, "type": "tf", "q": "Hysteresis means that the output depends on whether the input is increasing or decreasing.", "opts": ["True", "False"], "ans": "A", "exp": "صح. الـ Hysteresis معناها إن الخرج بيعتمد على اتجاه تغير الدخل (بيزيد أو بيقل)."}, {"n": 110, "type": "tf", "q": "Dead space is a range of input values over which there is no output change.", "opts": ["True", "False"], "ans": "A", "exp": "صح. الـ Dead space هو مدى من قيم الدخل ما فيهوش تغير في الخرج."}, {"n": 111, "type": "tf", "q": "Resolution is the largest change in input that can occur without any change in output.", "opts": ["True", "False"], "ans": "A", "exp": "صح. الـ Resolution هي أكبر تغير في الدخل بدون تغير مقابل في الخرج."}, {"n": 112, "type": "tf", "q": "For the same input range, a 16-bit ADC has a worse resolution than a 12-bit ADC.", "opts": ["True", "False"], "ans": "B", "exp": "غلط. الـ 16-bit ADC ليه resolution أحسن (أصغر) من الـ 12-bit لنفس المدى."}]};
const MINS = {1:30, 2:30, 3:60};
const LECS = {
  1:{name:'Lecture 1', sub:'Introduction to Measurements'},
  2:{name:'Lecture 2', sub:'Elements and Types of Instruments'},
  3:{name:'Lecture 3', sub:'Static Characteristics of Instruments'}
};
const QL = {};
for(const l of [1,2,3]) QL[l] = DATA[l].map((x,i)=>({id:i,n:x.n,type:x.type,q:x.q,opts:x.opts,ans:(x.type==='mcq'?'ABCD':'AB').indexOf(x.ans),exp:x.exp}));
const L = 'ABCD';
const KEY = l => 'mec361-exams-v2-L'+l;
const ST = {1:{phase:'start'},2:{phase:'start'},3:{phase:'start'}};
let lec = 1, S = ST[1];
let ui = {confirm:false, filter:'all'};
let tick = null;
const Q = () => QL[lec];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(l){ l = l||lec; try{ localStorage.setItem(KEY(l), JSON.stringify(ST[l])); }catch(e){} }
function load(l){ try{ const r = localStorage.getItem(KEY(l)); if(r){ const o = JSON.parse(r); if(o && o.phase) return o; } }catch(e){} return null; }
function clearSave(l){ try{ localStorage.removeItem(KEY(l)); }catch(e){} }
const mmss = ms => { const t = Math.max(0, Math.ceil(ms/1000)); return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); };
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function setLec(l, updateHash){
  lec = l; S = ST[l]; ui = {confirm:false, filter:'all'};
  if(updateHash){ try{ history.replaceState(null,'','#lecture-'+l); }catch(e){} }
  render(); window.scrollTo(0,0);
}
function begin(){
  const m = Q().filter(q=>q.type==='mcq').map(q=>q.id), t = Q().filter(q=>q.type==='tf').map(q=>q.id);
  const perm = {}; Q().forEach(q=>{ const ix = q.opts.map((_,i)=>i); perm[q.id] = q.type==='mcq' ? shuffle(ix) : ix; });
  ST[lec] = {phase:'exam', order:[...shuffle(m),...shuffle(t)], perm, answers:{}, flags:{}, cur:0, endsAt:Date.now()+MINS[lec]*60000, startedAt:Date.now()};
  S = ST[lec]; ui = {confirm:false, filter:'all'}; save(); render();
}
function submitLec(l){
  const s = ST[l]; if(!s || s.phase!=='exam') return;
  s.phase = 'result'; s.finishedAt = Math.min(Date.now(), s.endsAt); save(l);
  if(l===lec){ ui = {confirm:false, filter:'all'}; render(); window.scrollTo(0,0); } else renderTabs();
}
function startTick(){
  clearInterval(tick);
  tick = setInterval(()=>{
    for(const l of [1,2,3]){
      const s = ST[l]; if(s.phase!=='exam') continue;
      const left = s.endsAt - Date.now();
      if(l===lec){ const el = document.getElementById('timer'); if(el){ el.textContent = mmss(left); el.classList.toggle('low', left < 5*60000); } }
      if(left <= 0) submitLec(l);
    }
  }, 500);
}
function score(){
  let right=0, rm=0, rt=0, skipped=0;
  Q().forEach(q=>{ const a = S.answers[q.id]; if(a===undefined) skipped++; else if(a===q.ans){ right++; q.type==='mcq'?rm++:rt++; } });
  return {right, rm, rt, skipped, wrong: Q().length-right-skipped};
}
function scoreOf(l){ const s = ST[l]; let r=0; QL[l].forEach(q=>{ if(s.answers && s.answers[q.id]===q.ans) r++; }); return r; }
const P = qid => (S.perm && S.perm[qid]) || Q()[qid].opts.map((_,i)=>i);
const answered = () => Object.keys(S.answers).length;

function renderTabs(){
  document.getElementById('tabs').innerHTML = [1,2,3].map(l=>{
    const s = ST[l], n = QL[l].length;
    const st = s.phase==='exam' ? '<span class="st run">In progress</span>' : s.phase==='result' ? `<span class="st done">Done ${scoreOf(l)}/${n}</span>` : `<span class="st">${n} questions</span>`;
    return `<button class="tab" role="tab" id="tab-${l}" aria-selected="${l===lec}" data-a="tab" data-l="${l}"><b>${LECS[l].name}</b><small>${LECS[l].sub}</small>${st}</button>`;
  }).join('');
}
function viewStart(){
  const mcq = Q().filter(q=>q.type==='mcq').length, tf = Q().length - mcq;
  const per = Math.round(MINS[lec]*60/Q().length);
  return `<div class="wrap"><div class="start">
    <h2 style="font-size:clamp(26px,5vw,36px);margin-bottom:6px">${LECS[lec].name} Exam</h2>
    <p class="sub">${LECS[lec].sub}. Every ${LECS[lec].name} question from the Questions Bank.</p>
    <ul class="rules">
      <li><span>Questions</span><b>${Q().length} (${mcq} multiple choice, ${tf} true / false)</b></li>
      <li><span>Time</span><b>${MINS[lec]===60?'1 hour':MINS[lec]+' minutes'}, about ${per} seconds per question</b></li>
      <li><span>Order</span><b>Questions and answer choices are shuffled every attempt</b></li>
      <li><span>Marks</span><b>1 per question, no negative marking</b></li>
      <li><span>Feedback</span><b>Score and Arabic explanations after you submit</b></li>
    </ul>
    <div class="row"><button class="btn primary" data-a="start">Start exam</button></div></div></div>`;
}
function viewExam(){
  const qid = S.order[S.cur], q = Q()[qid], sel = S.answers[qid], n = S.order.length;
  const left = S.endsAt - Date.now();
  const pm = P(qid);
  const opts = pm.map((oi,d)=>`<button class="opt ${sel===oi?'sel':''}" data-a="pick" data-i="${d}" aria-pressed="${sel===oi}"><span class="k">${L[d]}</span><span>${esc(q.opts[oi])}</span></button>`).join('');
  const pal = S.order.map((id,p)=>`<button data-a="go" data-p="${p}" class="${S.answers[id]!==undefined?'done':''} ${S.flags[id]?'fl':''} ${p===S.cur?'cur':''}" aria-label="Question ${p+1}">${p+1}</button>`).join('');
  const un = n - answered();
  return `<div class="bar"><div class="barin">
      <span class="brand">MEC361 · ${LECS[lec].name}</span><span class="grow"></span>
      <span class="prog">${answered()} / ${n} answered</span>
      <span class="timer ${left<5*60000?'low':''}" id="timer" role="timer">${mmss(left)}</span>
      <button class="btn primary" data-a="ask">Submit</button></div></div>
    <div class="wrap">
    ${ui.confirm?`<div class="confirm"><span>${un?`You left <b>${un}</b> question${un>1?'s':''} unanswered. Submit anyway?`:'All questions answered. Submit the exam?'}</span><span class="row"><button class="btn" data-a="cancel">Keep working</button><button class="btn primary" data-a="submit">Submit exam</button></span></div>`:''}
    <div class="exam"><div>
      <div class="qcard">
        <div class="qmeta"><span class="qno">Question ${S.cur+1} of ${n}</span><span>${q.type==='mcq'?'Multiple choice':'True / False'} · Bank Q${q.n}</span></div>
        <p class="qtext">${esc(q.q)}</p>
        <div class="opts">${opts}</div>
        <div class="nav">
          <button class="btn" data-a="prev" ${S.cur===0?'disabled':''}>Previous</button>
          <button class="btn" data-a="next" ${S.cur===n-1?'disabled':''}>Next</button>
          <span class="grow"></span>
          <button class="btn flagbtn ${S.flags[qid]?'on':''}" data-a="flag">${S.flags[qid]?'Flagged for review':'Flag for review'}</button>
          ${sel!==undefined?`<button class="btn" data-a="clear">Clear answer</button>`:''}
        </div>
      </div>
      <p class="muted" style="font-size:13px;margin-top:10px">Keys: A–D (or 1–4) pick an answer, arrows move, F flags.</p>
    </div>
    <aside class="side"><h3>Questions</h3><div class="pal">${pal}</div>
      <div class="legend"><span><i class="sw" style="background:var(--accent-soft);border-color:var(--accent)"></i>Answered</span><span><i class="sw" style="box-shadow:inset 0 -3px 0 var(--flag)"></i>Flagged</span><span><i class="sw"></i>Open</span></div>
    </aside></div></div>`;
}
function viewResult(){
  const sc = score(), n = Q().length, pct = Math.round(sc.right/n*100);
  const mcq = Q().filter(q=>q.type==='mcq').length, tf = n - mcq;
  const used = mmss(S.finishedAt - S.startedAt);
  const items = S.order.map((id,p)=>({q:Q()[id],p,a:S.answers[id],fl:!!S.flags[id]}));
  const f = ui.filter;
  const shown = items.filter(it=> f==='all' || (f==='wrong'&&it.a!==undefined&&it.a!==it.q.ans) || (f==='skip'&&it.a===undefined) || (f==='flag'&&it.fl));
  const counts = {all:items.length, wrong:sc.wrong, skip:sc.skipped, flag:items.filter(i=>i.fl).length};
  const seg = [['all','All'],['wrong','Wrong'],['skip','Unanswered'],['flag','Flagged']].map(([k,t])=>`<button class="${f===k?'on':''}" data-a="filter" data-f="${k}">${t} (${counts[k]})</button>`).join('');
  const cards = shown.map(({q,p,a})=>{
    const st = a===undefined?'skip':(a===q.ans?'ok':'no');
    const pill = st==='ok'?'<span class="pill ok">Correct</span>':st==='no'?'<span class="pill no">Wrong</span>':'<span class="pill skip">Unanswered</span>';
    const rows = P(q.id).map((i,d)=>{
      const o = q.opts[i];
      const cls = i===q.ans?'right':(i===a?'wrong':'');
      const tag = i===a?'Your answer':(i===q.ans?'Correct':'');
      return `<div class="ro ${cls}"><b>${L[d]}</b><span>${esc(o)}</span>${tag?`<span class="tag">${tag}</span>`:''}</div>`;
    }).join('');
    return `<article class="rv"><div class="qmeta"><span class="qno">Question ${p+1} · Bank Q${q.n}</span>${pill}</div><p class="qtext">${esc(q.q)}</p>${rows}<div class="exp" lang="ar">${esc(q.exp)}</div></article>`;
  }).join('') || '<p class="muted">Nothing here.</p>';
  return `<div class="bar"><div class="barin"><span class="brand">MEC361 · ${LECS[lec].name}</span><span class="grow"></span><button class="btn primary" data-a="again">Take it again</button></div></div>
    <div class="wrap res"><h2>${LECS[lec].name} result</h2>
      <div class="score"><div class="big">${sc.right}<small> / ${n}</small></div>
        <div class="stats"><span><b>${pct}%</b> overall</span><span>Multiple choice <b>${sc.rm} / ${mcq}</b></span><span>True / False <b>${sc.rt} / ${tf}</b></span><span>Wrong <b>${sc.wrong}</b></span><span>Unanswered <b>${sc.skipped}</b></span><span>Time <b>${used}</b></span></div></div>
      <h3>Review with explanations</h3>
      <div class="seg">${seg}</div>${cards}</div>`;
}
function render(){
  renderTabs();
  const v = document.getElementById('view');
  v.innerHTML = S.phase==='exam' ? viewExam() : S.phase==='result' ? viewResult() : viewStart();
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-a]'); if(!b) return;
  const a = b.dataset.a;
  if(a==='tab'){ setLec(+b.dataset.l, true); return; }
  if(a==='start'){ begin(); return; }
  if(a==='again'){ clearSave(lec); ST[lec] = {phase:'start'}; S = ST[lec]; render(); window.scrollTo(0,0); return; }
  if(a==='filter'){ ui.filter = b.dataset.f; render(); return; }
  if(S.phase!=='exam') return;
  const qid = S.order[S.cur];
  if(a==='pick'){ S.answers[qid] = P(qid)[+b.dataset.i]; }
  else if(a==='clear'){ delete S.answers[qid]; }
  else if(a==='flag'){ S.flags[qid] = !S.flags[qid]; if(!S.flags[qid]) delete S.flags[qid]; }
  else if(a==='prev'){ S.cur = Math.max(0,S.cur-1); }
  else if(a==='next'){ S.cur = Math.min(S.order.length-1,S.cur+1); }
  else if(a==='go'){ S.cur = +b.dataset.p; }
  else if(a==='ask'){ ui.confirm = true; }
  else if(a==='cancel'){ ui.confirm = false; }
  else if(a==='submit'){ submitLec(lec); return; }
  save(); render();
});
document.addEventListener('keydown', e=>{
  if(S.phase!=='exam' || e.target.matches('input,textarea')) return;
  const q = Q()[S.order[S.cur]]; const k = e.key.toLowerCase();
  let i = 'abcd'.indexOf(k); if(i<0) i = '1234'.indexOf(k);
  if(i>=0 && i<q.opts.length){ S.answers[S.order[S.cur]] = P(S.order[S.cur])[i]; save(); render(); }
  else if(k==='arrowright'){ S.cur=Math.min(S.order.length-1,S.cur+1); save(); render(); }
  else if(k==='arrowleft'){ S.cur=Math.max(0,S.cur-1); save(); render(); }
  else if(k==='f'){ const id=S.order[S.cur]; S.flags[id]=!S.flags[id]; if(!S.flags[id]) delete S.flags[id]; save(); render(); }
});
window.addEventListener('hashchange', ()=>{ const m = /^#lecture-([123])$/.exec(location.hash); if(m && +m[1]!==lec) setLec(+m[1], false); });
(function init(){
  for(const l of [1,2,3]){
    const r = load(l); if(r) ST[l] = r;
    if(ST[l].phase==='exam' && ST[l].endsAt<=Date.now()){ ST[l].phase='result'; ST[l].finishedAt = ST[l].endsAt; save(l); }
  }
  const m = /^#lecture-([123])$/.exec(location.hash); lec = m ? +m[1] : 1; S = ST[lec];
  startTick(); render();
})();
</script>
</body>
</html>
